name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version, e.g. 2.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/GameOfLife.Tests -c Release

      - name: Version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_INPUT" ]]; then
            if [[ ! "$RELEASE_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release version must look like 2.0.0"; exit 1
            fi
            echo "value=${RELEASE_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build GameOfLife.exe
        run: dotnet build src/GameOfLife -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      - name: Package
        run: |
          mkdir -p dist/GameOfLife
          cp publish/GameOfLife.exe publish/GameOfLife.exe.config dist/GameOfLife/
          cp README.md LICENSE game_of_life_console.py dist/GameOfLife/
          cp publish/GameOfLife.exe dist/
          (cd dist && 7z a -tzip GameOfLife-${{ steps.version.outputs.value }}-windows.zip GameOfLife > /dev/null)
          rm -rf dist/GameOfLife
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-windows
          path: dist/
          if-no-files-found: error

  release:
    # Runs for a pushed v* tag, or for a manual run with a version filled in
    # (then the tag is created by the release itself).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GameOfLife-windows
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          sed "s/{{TAG}}/$TAG/g" .github/release-notes.md > notes.md
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Game of Life $TAG" \
            --notes-file notes.md
